---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: users.keycloak-operator.webhippie.de
spec:
  group: keycloak-operator.webhippie.de
  names:
    kind: User
    listKind: UserList
    plural: users
    singular: user
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.realmRef.name
      name: Realm
      type: string
    - jsonPath: .spec.username
      name: Username
      type: string
    - jsonPath: .spec.email
      name: Email
      type: string
    - jsonPath: .spec.enabled
      name: Enabled
      type: boolean
    - jsonPath: .status.keycloakID
      name: KeycloakID
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: User is the Schema for the users API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of User
            properties:
              attributes:
                additionalProperties:
                  items:
                    type: string
                  type: array
                description: |-
                  attributes holds custom user attributes as key/value pairs where each
                  key maps to one or more values.
                type: object
              email:
                description: email specifies the user's email address.
                type: string
              emailVerified:
                description: emailVerified specifies whether the user's email address
                  has been verified.
                type: boolean
              enabled:
                description: enabled specifies whether the user account is active.
                type: boolean
              firstName:
                description: firstName specifies the user's first name.
                type: string
              groups:
                description: |-
                  groups lists the names of Keycloak groups this user should be a member
                  of. Membership is managed relative to what this operator previously
                  applied (see status.groups): removing a name from this list removes
                  the corresponding membership, but memberships added outside of this
                  resource are left untouched.
                items:
                  type: string
                type: array
              lastName:
                description: lastName specifies the user's last name.
                type: string
              password:
                description: |-
                  password references a secret or direct value which contains the initial
                  password to set for the user. If unset, no password is set in Keycloak
                  and the user cannot authenticate until an administrator sets one
                  (e.g. via the Keycloak console/API or a "forgot password" email flow).
                properties:
                  secretKeyRef:
                    description: SecretKeyRef selects a key of a Kubernetes Secret.
                    properties:
                      key:
                        description: Key is the key of the Secret to select from.
                        type: string
                      name:
                        description: Name is the name of the Secret.
                        type: string
                      namespace:
                        description: Namespace of the Secret.
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  value:
                    description: Value directly specifies the value as a plain string.
                    type: string
                type: object
              realmRef:
                description: |-
                  realmRef is a reference to the Realm this user belongs to.
                  The Keycloak connection is resolved transitively through the Realm resource.
                properties:
                  kind:
                    default: Realm
                    description: Kind specifies the kind of the Realm resource.
                    enum:
                    - Realm
                    type: string
                  name:
                    description: Name specifies the name of the Realm resource.
                    type: string
                  namespace:
                    description: Namespace specifies the namespace of the Realm resource.
                    type: string
                required:
                - name
                type: object
              realmRoles:
                description: |-
                  realmRoles lists the names of realm-level roles assigned directly to
                  this user. Assignment is managed relative to what this operator
                  previously applied (see status.realmRoles): removing a name from this
                  list revokes the corresponding role, but roles assigned outside of
                  this resource (e.g. default realm roles) are left untouched.
                items:
                  type: string
                type: array
              requiredActions:
                description: |-
                  requiredActions lists the actions the user must perform on next login
                  (e.g. UPDATE_PASSWORD, VERIFY_EMAIL).
                items:
                  type: string
                type: array
              temporary:
                default: true
                description: |-
                  temporary specifies whether the password set via the password field is
                  temporary, forcing the user to change it on next login. Defaults to
                  true and is only relevant when password is set.
                type: boolean
              username:
                description: username specifies the login name of the user.
                type: string
            required:
            - realmRef
            - username
            type: object
          status:
            description: status defines the observed state of User
            properties:
              conditions:
                description: |-
                  conditions represent the current state of the User resource.
                  Each condition has a unique type and reflects the status of a specific aspect of the resource.

                  Standard condition types include:
                  - "Available": the resource is fully functional
                  - "Progressing": the resource is being created or updated
                  - "Degraded": the resource failed to reach or maintain its desired state

                  The status of each condition is one of True, False, or Unknown.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              groups:
                description: |-
                  groups records the names of Keycloak groups this operator has most
                  recently applied for this user, used to determine which memberships
                  to revoke when spec.groups is changed.
                items:
                  type: string
                type: array
              keycloakID:
                description: |-
                  keycloakID is the UUID assigned by Keycloak for this user.
                  It is stored here so that update and delete operations can reference the
                  user directly without an additional lookup by username.
                type: string
              realmRoles:
                description: |-
                  realmRoles records the names of realm-level roles this operator has
                  most recently applied for this user, used to determine which role
                  assignments to revoke when spec.realmRoles is changed.
                items:
                  type: string
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
